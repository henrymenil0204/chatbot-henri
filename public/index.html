<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Henri Chatbot</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<style>
:root {
  --bg: #0e1210;
  --bg-raised: #151a17;
  --border: #262d29;
  --text: #e9ede9;
  --text-dim: #8a938c;
  --accent: #ff8a3d;
  --accent-dim: #3a2a1c;
  --user-bubble: #1c2320;
  --bot-bubble: transparent;
  --radius: 10px;
  --sidebar-w: 264px;
  --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overscroll-behavior: none;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Shell layout ---------- */
.shell {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-raised);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.02em;
  color: var(--text);
  min-width: 0;
}

.brand-logo {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  flex-shrink: 0;
  display: block;
}

.brand-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.new-chat-btn {
  margin: 12px 16px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, color 0.15s;
  flex-shrink: 0;
}
.new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }
.new-chat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  -webkit-overflow-scrolling: touch;
}

.session-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  background: transparent;
  border: none;
  font-family: var(--sans);
}
.session-item:hover { background: var(--user-bubble); color: var(--text); }
.session-item.active { background: var(--accent-dim); color: var(--text); }
.session-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.session-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-empty {
  padding: 20px 14px;
  color: var(--text-dim);
  font-size: 12.5px;
  text-align: center;
  line-height: 1.5;
}

/* ---------- Mobile-only controls (hidden on desktop) ---------- */
.icon-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 40;
}

.mobile-brand { display: none; }

/* ---------- Main chat column ---------- */
.app {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-spacer { flex: 1; }

.ghost-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.ghost-btn:hover { border-color: var(--accent); color: var(--text); }
.ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.log {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  -webkit-overflow-scrolling: touch;
}

.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  padding: 0 20px;
}

.msg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 88%;
  animation: rise 0.2s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }

.msg-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}

.msg.user .msg-label { color: var(--accent); }

.bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.msg.user .bubble {
  background: var(--user-bubble);
  border: 1px solid var(--border);
}

.msg.assistant .bubble {
  background: var(--bot-bubble);
  padding-left: 0;
  padding-right: 0;
}

.msg.assistant.pending .bubble {
  color: var(--text-dim);
}

.dots::after {
  content: "";
  animation: dots 1.2s steps(4, end) infinite;
}
@keyframes dots {
  0% { content: ""; }
  25% { content: "."; }
  50% { content: ".."; }
  75% { content: "..."; }
  100% { content: ""; }
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 14px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

textarea#input {
  flex: 1;
  resize: none;
  max-height: 160px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
  font-family: var(--sans);
  line-height: 1.4;
}
textarea#input:focus-visible {
  outline: none;
  border-color: var(--accent);
}
textarea#input::placeholder { color: var(--text-dim); }

.send-btn {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #1a1200;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.15s;
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:active { transform: scale(0.96); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.error-note {
  font-family: var(--mono);
  font-size: 12px;
  color: #ff6b6b;
  align-self: flex-start;
}

/* Scrollbars */
.log::-webkit-scrollbar, .session-list::-webkit-scrollbar { width: 8px; }
.log::-webkit-scrollbar-thumb, .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ---------- Mobile layout (<=768px) ---------- */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4);
    width: min(var(--sidebar-w), 82vw);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-overlay.show { display: block; }

  .icon-btn { display: flex; }

  .app-header { padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  .mobile-brand { display: flex; }
  .desktop-only-text { display: none; }

  .log { padding: 18px 14px 8px; }
  .composer { padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .msg { max-width: 94%; }
}

@media (min-width: 769px) {
  .sidebar-close-btn { display: none !important; }
}
</style>
</head>
<body>
  <div class="shell">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="logo.svg" alt="Henri Chatbot logo" class="brand-logo" />
          <span class="brand-name">Henri Chatbot</span>
        </div>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close-btn" aria-label="Close history">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn">+ New chat</button>

      <nav class="session-list" id="sessionList" aria-label="Chat history">
        <div class="session-empty" id="sessionEmpty">No past chats yet.</div>
      </nav>
    </aside>

    <div class="app">
      <header class="app-header">
        <button id="menuBtn" class="icon-btn" aria-label="Open history">☰</button>
        <div class="brand mobile-brand">
          <img src="logo.svg" alt="Henri Chatbot logo" class="brand-logo" />
          <span class="brand-name">Henri Chatbot</span>
        </div>
        <div class="header-spacer"></div>
        <button id="clearBtn" class="ghost-btn" title="Start a new session">new session</button>
      </header>

      <main id="log" class="log">
        <div class="empty-state" id="emptyState">
          <p>Say something to start the conversation.</p>
        </div>
      </main>

      <form id="chatForm" class="composer">
        <textarea
          id="input"
          placeholder="Message…"
          rows="1"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
const log = document.getElementById('log');
const emptyState = document.getElementById('emptyState');
const form = document.getElementById('chatForm');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const menuBtn = document.getElementById('menuBtn');
const closeSidebarBtn = document.getElementById('closeSidebarBtn');
const newChatBtn = document.getElementById('newChatBtn');
const sessionList = document.getElementById('sessionList');
const sessionEmpty = document.getElementById('sessionEmpty');

let sessionId = 'session-' + Math.random().toString(36).slice(2) + Date.now().toString(36);

// ---------- Sidebar open/close (mobile) ----------
function openSidebar() {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('show');
}
function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
}
menuBtn.addEventListener('click', openSidebar);
closeSidebarBtn.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

// ---------- Composer ----------
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', autoGrow);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

function addMessage(role, text) {
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'you' : 'assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function addPending() {
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant pending';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble dots';
  bubble.textContent = 'thinking';
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function renderLog(messages) {
  log.querySelectorAll('.msg, .error-note').forEach((el) => el.remove());
  if (!messages || messages.length === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  messages.forEach((m) => addMessage(m.role, m.content));
}

async function sendMessage(message) {
  addMessage('user', message);
  const pendingWrap = addPending();
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sessionId }),
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || `Request failed (${res.status})`);
    }

    const data = await res.json();
    pendingWrap.remove();
    addMessage('assistant', data.reply);
    loadSessions(); // refresh sidebar so this session shows/updates
  } catch (err) {
    pendingWrap.remove();
    const note = document.createElement('div');
    note.className = 'error-note';
    note.textContent = `Error: ${err.message}`;
    log.appendChild(note);
    log.scrollTop = log.scrollHeight;
  } finally {
    sendBtn.disabled = false;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoGrow();
  sendMessage(text);
});

function startNewSession() {
  sessionId = 'session-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  renderLog([]);
  highlightActiveSession();
  closeSidebar();
}
clearBtn.addEventListener('click', startNewSession);
newChatBtn.addEventListener('click', startNewSession);

// ---------- Session sidebar ----------
function highlightActiveSession() {
  sessionList.querySelectorAll('.session-item').forEach((el) => {
    el.classList.toggle('active', el.dataset.id === sessionId);
  });
}

async function openSession(id) {
  sessionId = id;
  highlightActiveSession();
  closeSidebar();
  try {
    const res = await fetch(`/api/history/${encodeURIComponent(id)}`);
    const data = await res.json();
    renderLog(data.history || []);
  } catch (err) {
    renderLog([]);
  }
}

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    const data = await res.json();
    const sessions = data.sessions || [];

    sessionList.querySelectorAll('.session-item').forEach((el) => el.remove());

    if (sessions.length === 0) {
      sessionEmpty.style.display = 'block';
      return;
    }
    sessionEmpty.style.display = 'none';

    sessions.forEach((s) => {
      const btn = document.createElement('button');
      btn.className = 'session-item';
      btn.dataset.id = s.id;
      btn.innerHTML = `<span class="session-title">${escapeHtml(s.title || 'New chat')}</span>`;
      btn.addEventListener('click', () => openSession(s.id));
      sessionList.appendChild(btn);
    });

    highlightActiveSession();
  } catch (err) {
    // Sidebar just stays empty if this fails — chat still works without it.
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadSessions();
</script>
</body>
</html>
